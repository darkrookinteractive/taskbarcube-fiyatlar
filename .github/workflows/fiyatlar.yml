name: Steam Pazari fiyatlari

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:                     # fiyat programi / is akisi degisince hemen calisir (bot kaydi fiyatlar.json tetiklemez)
    paths:
      - "fiyat.js"
      - ".github/workflows/fiyatlar.yml"

permissions:
  contents: write

concurrency:
  group: fiyatlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fiyatlari cek
        env:
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
        run: node fiyat.js
      - name: Degistiyse kaydet
        run: |
          git config user.name "fiyat-botu"
          git config user.email "fiyat-botu@users.noreply.github.com"
          for f in fiyatlar.json ham_api.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "Fiyatlar guncellendi"
            git pull --rebase origin main
            git push
          fi
